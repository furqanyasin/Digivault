<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Digivault — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7; --white: #ffffff; --border: #e5e7eb;
      --text: #111928; --muted: #6b7280;
      --primary: #1a56db; --primary-hover: #1344b8;
      --green: #057a55; --red: #e02424; --radius: 7px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      font-size: 14px; line-height: 1.6; min-height: 100vh;
      display: flex; justify-content: center; padding: 40px 20px;
    }

    .container { width: 100%; max-width: 480px; }

    h1 {
      font-size: 20px; font-weight: 700; margin-bottom: 4px;
      display: flex; align-items: center; gap: 10px; color: var(--primary);
    }

    h1 img { border-radius: 8px; }

    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

    hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text); }

    .field { margin-bottom: 20px; }

    label { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

    input[type="url"],
    input[type="email"],
    input[type="password"] {
      width: 100%; padding: 9px 12px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      font-family: var(--font);
    }

    input[type="url"] { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }

    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .btn {
      padding: 9px 22px; border: none; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
      font-family: var(--font);
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { opacity: 0.85; }

    .status-msg { font-size: 13px; font-weight: 500; min-height: 1.4em; }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }

    .logged-in-info {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 11px 14px; background: #eff6ff;
      border: 1px solid #bfdbfe; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 16px;
    }

    .logged-in-info span { flex: 1; color: var(--muted); }
    .logged-in-info strong { color: var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <h1><img src="../icons/icon48.png" width="32" height="32" alt="" /> Extension Settings</h1>
    <p class="subtitle">Configure your Digivault account and server connection.</p>

    <h2>Account</h2>

    <div id="logged-in-section" style="display:none">
      <div class="logged-in-info">
        <span>Logged in as <strong id="logged-in-email"></strong></span>
        <button class="btn btn-danger" id="logout-btn" type="button">Log out</button>
      </div>
    </div>

    <div id="login-section">
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Log in</button>
          <span id="login-status" class="status-msg" role="status" aria-live="polite"></span>
        </div>
      </form>
    </div>

    <hr />

    <h2>Server</h2>
    <form id="options-form" novalidate>
      <div class="field">
        <label for="server-url">API Server URL</label>
        <input
          type="url" id="server-url" name="server-url"
          placeholder="https://digivault.digilatics.co"
          required autocomplete="off" spellcheck="false"
        />
        <p class="hint">Leave as default unless using a self-hosted or staging server.</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <span id="server-status" class="status-msg ok" role="status" aria-live="polite"></span>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
