<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self';" />
  <link rel="stylesheet" href="popup.css" />
  <title>Digivault</title>
</head>
<body>

  <!-- ═══════════ LOGIN SCREEN ═══════════ -->
  <div id="screen-login" style="display:none">
    <div class="login-wrap">
      <div class="login-logo">
        <img src="../icons/icon48.png" width="36" height="36" alt="" />
        <span class="login-brand">Digivault</span>
      </div>

      <div class="login-header-row">
        <h1 class="login-heading">LOG IN</h1>
      </div>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="login-email">Email address</label>
          <input class="field-input" type="email" id="login-email" autocomplete="email" required />
        </div>
        <div class="field-group">
          <label class="field-label" for="login-pw">Master password</label>
          <div class="pw-wrap">
            <input class="field-input" type="password" id="login-pw" autocomplete="current-password" required />
            <button type="button" class="pw-eye" id="pw-eye-btn" aria-label="Toggle password visibility">
              <svg id="pw-eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="login-error"></p>
        </div>
        <button class="btn-primary btn-pill" type="submit" id="login-submit-btn">LOG IN</button>
      </form>

      <div class="login-footer-links">
        <button class="link-text" id="forgot-btn">Forgot master password?</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ MAIN SCREEN ═══════════ -->
  <div id="screen-main" style="display:none">

    <!-- ── VAULT TAB ──────────────────────── -->
    <div id="tab-vault" class="tab-pane">
      <div class="vault-topbar">
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" type="text" id="vault-search" placeholder="Search" />
        </div>
        <a class="vault-open-link" id="vault-open-btn" href="#" title="Open vault">
          <span>Vault</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><line x1="21" y1="3" x2="9" y2="15"/></svg>
        </a>
      </div>

      <div class="filter-row">
        <button class="filter-tab active" data-filter="site">For this site</button>
        <button class="filter-tab" data-filter="all">All items</button>
        <button class="filter-tab" data-filter="recent">Recents</button>
      </div>

      <div id="vault-body" class="tab-body"></div>
    </div>

    <!-- ── GENERATOR TAB ──────────────────── -->
    <div id="tab-generator" class="tab-pane" style="display:none">
      <div class="gen-body">
        <div class="gen-tip-banner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span><strong>Security tip:</strong> Use generated passwords to keep your accounts safe.
          <button class="dismiss-btn" id="gen-dismiss-btn">Dismiss</button></span>
        </div>

        <div class="gen-output-section">
          <p class="gen-section-label">Password suggestion</p>
          <div class="gen-output-row">
            <span class="gen-password" id="gen-password">Loading…</span>
            <div class="gen-output-actions">
              <button class="gen-icon-btn" id="gen-copy-btn" title="Copy password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="gen-icon-btn" id="gen-refresh-btn" title="Generate new">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="gen-strength-section">
          <p class="gen-strength-label" id="gen-strength-text">Very Strong</p>
          <div class="gen-strength-track">
            <div class="gen-strength-bar" id="gen-strength-bar"></div>
          </div>
        </div>

        <div class="gen-controls">
          <div class="gen-length-row">
            <span class="gen-ctrl-label">Password length:</span>
            <input class="gen-length-num" type="number" id="gen-length-num" min="8" max="64" value="16" />
            <span class="gen-ctrl-unit">characters</span>
          </div>
          <input class="gen-slider" type="range" id="gen-slider" min="8" max="64" value="16" />

          <div class="gen-checks">
            <label class="gen-check-row"><input type="checkbox" id="gen-lower" checked /><span>Lowercase (abc)</span></label>
            <label class="gen-check-row"><input type="checkbox" id="gen-upper" checked /><span>Uppercase (ABC)</span></label>
            <label class="gen-check-row"><input type="checkbox" id="gen-nums"  checked /><span>Numbers (123)</span></label>
            <label class="gen-check-row"><input type="checkbox" id="gen-syms"  checked /><span>Randomized symbols (!#$)</span></label>
          </div>
        </div>

        <div class="gen-footer">
          <button class="link-text" id="gen-history-btn">See password history</button>
        </div>
      </div>
    </div>

    <!-- ── ALERTS TAB ─────────────────────── -->
    <div id="tab-alerts" class="tab-pane" style="display:none">
      <div id="alerts-body" class="tab-body"></div>
    </div>

    <!-- ── ACCOUNT TAB ────────────────────── -->
    <div id="tab-account" class="tab-pane" style="display:none">
      <div class="account-body">
        <div class="account-email-row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="account-email-txt">Loading…</span>
        </div>

        <div class="account-menu">
          <a class="account-item" id="acc-dashboard-btn" href="#" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Open Dashboard</span>
            <svg class="item-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          <a class="account-item" id="acc-vault-btn" href="#" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Credentials Vault</span>
            <svg class="item-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

          <div class="account-divider"></div>

          <button class="account-item" id="acc-settings-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            <span>Extension settings</span>
            <svg class="item-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="account-item" id="acc-about-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>About Digivault</span>
          </button>

          <div class="account-divider"></div>

          <button class="account-item account-logout" id="acc-logout-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Log out</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ── BOTTOM NAV ─────────────────────── -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="vault">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Vault</span>
      </button>
      <button class="nav-btn" data-tab="generator">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span>Generator</span>
      </button>
      <button class="nav-btn" data-tab="alerts">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Alerts</span>
        <span class="nav-badge" id="nav-alerts-badge" style="display:none"></span>
      </button>
      <button class="nav-btn" data-tab="account">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Account</span>
      </button>
    </nav>
  </div>

  <script src="popup.js"></script>
</body>
</html>
