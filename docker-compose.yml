version: "3.9"

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: digivault
      POSTGRES_USER: digivault
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digivault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: >
      sh -c "python manage.py migrate --settings=config.settings.development &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
    ports:
      # Bind to loopback only — this is the DEV compose file and must never
      # expose Django directly on a public interface (use
      # docker-compose.production.cloudpanel.yml on servers).
      - "127.0.0.1:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    # Dev runs one worker across every queue: the isolation the production
    # files buy is about one slow task not starving ingest under real load,
    # which is not a thing that happens on a laptop. The `-Q` list still has
    # to name them all, though — CELERY_TASK_ROUTES routes by queue, and a
    # queue with no consumer silently never runs.
    command: celery -A config worker -l info -Q ingest,monitors,slow,celery
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  postgres_data:
