version: "3.9"

# CloudPanel variant — backend services only.
# Frontend is managed by CloudPanel's Node.js manager on port 3006.
# CloudPanel Nginx proxies /api + /admin + /ws → 127.0.0.1:8000
#                           /      (everything else) → 127.0.0.1:3006

services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: digivault
      POSTGRES_USER: digivault
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digivault"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      args:
        REQ: production.txt
    restart: always
    # uvicorn, not daphne: daphne is a single process and Django runs sync views
    # under ASGI in one shared thread, so every concurrent request queued behind
    # the last. Worker count defaults to 4; override by exporting
    # UVICORN_WORKERS in the deploy shell or putting it in `.env` — compose
    # interpolates from those, NOT from the .env.production below (that file is
    # env_file, which only reaches the container). Rule of thumb: 2x CPU cores.
    command: >
      sh -c "python manage.py migrate --settings=config.settings.production &&
             python manage.py collectstatic --noinput --settings=config.settings.production &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000
             --workers ${UVICORN_WORKERS:-4} --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      args:
        REQ: production.txt
    restart: always
    command: celery -A config worker -l warning --concurrency=2
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      args:
        REQ: production.txt
    restart: always
    command: celery -A config beat -l warning -s /tmp/celerybeat-schedule
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - redis

volumes:
  postgres_data:
  static_files:
  media_files:
